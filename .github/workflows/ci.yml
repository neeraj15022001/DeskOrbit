name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Verify Swift Version
        run: swift --version

      - name: Build Debug
        run: swift build -v

      - name: Build Release Bundle
        run: ./bundle_app.sh

      - name: Verify App Bundle Exists
        run: |
          test -d DeskOrbit.app
          test -f DeskOrbit.app/Contents/MacOS/DeskOrbit
          echo "DeskOrbit.app successfully built and verified!"
