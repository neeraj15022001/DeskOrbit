name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag name (optional, e.g. v1.4.0)'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app || true
          swift --version

      - name: Resolve Version & Tag
        id: version
        run: |
          git fetch --tags --force || true
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            TITLE="DeskOrbit ${TAG_NAME}"
          elif [[ -n "${{ inputs.custom_tag }}" ]]; then
            RAW_TAG="${{ inputs.custom_tag }}"
            if [[ ! "$RAW_TAG" =~ ^v ]]; then
              TAG_NAME="v$RAW_TAG"
            else
              TAG_NAME="$RAW_TAG"
            fi
            VERSION="${TAG_NAME#v}"
            TITLE="DeskOrbit ${TAG_NAME}"
          else
            # Extract version from CHANGELOG.md
            CHANGELOG_VER=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/.*\[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
            if [[ -z "$CHANGELOG_VER" ]]; then
              CHANGELOG_VER="1.4.0"
            fi
            
            BASE_TAG="v${CHANGELOG_VER}"
            
            if git rev-parse "refs/tags/${BASE_TAG}" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-parse "refs/tags/${BASE_TAG}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${BASE_TAG}" 2>/dev/null)
              HEAD_COMMIT=$(git rev-parse HEAD)
              if [[ "$TAG_COMMIT" == "$HEAD_COMMIT" ]]; then
                echo "HEAD matches existing tag ${BASE_TAG}"
                TAG_NAME="${BASE_TAG}"
                VERSION="${CHANGELOG_VER}"
                TITLE="DeskOrbit ${TAG_NAME}"
              else
                TAG_NAME="${BASE_TAG}.${{ github.run_number }}"
                VERSION="${CHANGELOG_VER}.${{ github.run_number }}"
                TITLE="DeskOrbit ${BASE_TAG} (Build ${{ github.run_number }})"
              fi
            else
              TAG_NAME="${BASE_TAG}"
              VERSION="${CHANGELOG_VER}"
              TITLE="DeskOrbit ${TAG_NAME}"
            fi
          fi
          
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG_NAME}"
          echo "Resolved Version: ${VERSION}"
          echo "Release Title: ${TITLE}"

      - name: Extract Release Notes from CHANGELOG
        run: |
          awk '/^## \[/{if (found) exit; found=1; next} found{if (/^---/ || /^## \[/) exit; print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Automated continuous release of DeskOrbit for commit ${{ github.sha }}." > RELEASE_NOTES.md
          fi

      - name: Build Release Bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./bundle_app.sh
          test -d DeskOrbit.app
          test -f DeskOrbit.app/Contents/MacOS/DeskOrbit
          test -f DeskOrbit.app/Contents/Resources/AppIcon.icns
          echo "DeskOrbit.app built and validated successfully!"

      - name: Package Release DMG and ZIP
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dmg_staging
          cp -R DeskOrbit.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "DeskOrbit" -srcfolder dmg_staging -ov -format UDZO "DeskOrbit-${TAG}.dmg"
          ditto -c -k --keepParent DeskOrbit.app "DeskOrbit-${TAG}.zip"
          rm -rf dmg_staging
          
          # Generate SHA256 checksums
          shasum -a 256 "DeskOrbit-${TAG}.dmg" > "DeskOrbit-${TAG}.dmg.sha256"
          shasum -a 256 "DeskOrbit-${TAG}.zip" > "DeskOrbit-${TAG}.zip.sha256"
          
          echo "Release assets generated:"
          ls -lh DeskOrbit-*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DeskOrbit-*.dmg
            DeskOrbit-*.zip
            DeskOrbit-*.sha256
