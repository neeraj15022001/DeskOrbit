name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Release Bundle
        run: ./bundle_app.sh

      - name: Package Release DMG and ZIP
        run: |
          mkdir -p dmg_staging
          cp -R DeskOrbit.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "DeskOrbit" -srcfolder dmg_staging -ov -format UDZO "DeskOrbit-${{ github.ref_name }}.dmg"
          ditto -c -k --keepParent DeskOrbit.app "DeskOrbit-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DeskOrbit ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DeskOrbit-*.dmg
            DeskOrbit-*.zip
