<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Logo Dial Gradients -->
    <linearGradient id="dial-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow-cyan)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow-purple)"/>
  <rect width="1200" height="420" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Left: Logo Icon Graphic -->
  <g transform="translate(70, 70)" filter="url(#shadow)">
    <!-- Squircle container -->
    <rect width="280" height="280" rx="64" fill="#0B1120" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Outer Orbital Track -->
    <circle cx="140" cy="140" r="105" fill="none" stroke="#1E293B" stroke-width="8"/>
    <path d="M 140 35 A 105 105 0 1 1 50 200" fill="none" stroke="url(#dial-rim)" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow)"/>

    <!-- Orbital Satellite Nodes -->
    <circle cx="140" cy="35" r="7" fill="#38BDF8" filter="url(#neon-glow)"/>
    <circle cx="245" cy="140" r="5" fill="#818CF8"/>
    <circle cx="140" cy="245" r="5" fill="#34D399"/>
    <circle cx="35" cy="140" r="5" fill="#F59E0B"/>

    <!-- Central Hub Display Silhouette -->
    <rect x="80" y="86" width="120" height="78" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="3"/>
    <path d="M 125 164 L 125 182 L 110 182 L 170 182 L 155 182 L 155 164" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Audio Waveform in Screen -->
    <line x1="102" y1="125" x2="102" y2="125" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="114" y1="115" x2="114" y2="135" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="126" y1="105" x2="126" y2="145" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="138" y1="112" x2="138" y2="138" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="102" x2="150" y2="148" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="162" y1="116" x2="162" y2="134" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="174" y1="123" x2="174" y2="127" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right: Typography & Highlights -->
  <g transform="translate(410, 85)">
    <!-- Version & Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="14" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="90" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">macOS 14+ • Swift 6 Native</text>
    </g>

    <!-- App Title -->
    <text x="0" y="85" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">DeskOrbit</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">The universal hardware &amp; peripheral command hub for your Mac.</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 160)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">🖥️ DDC/CI &amp; Gamma</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(180, 0)">
        <rect width="165" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">🔊 CoreAudio Routing</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(355, 0)">
        <rect width="175" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">⚡ Bluetooth Battery</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(540, 0)">
        <rect width="160" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">💾 Safe Eject Drives</text>
      </g>
    </g>

    <!-- Footer meta -->
    <text x="0" y="235" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">Open Source • Menu Bar Popover + Home-Style Grid Dashboard • Zero Telemetry</text>
  </g>
</svg>
